name: Flutter Multi-Platform Build Master

env:
  FLUTTER_CHANNEL: 'master'

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: '构建 iOS'
        required: false
        default: true
        type: boolean
      build_android:
        description: '构建 Android'
        required: false
        default: false
        type: boolean
      build_mac:
        description: '构建 macOS'
        required: false
        default: false
        type: boolean
      build_windows:
        description: '构建 Windows'
        required: false
        default: false
        type: boolean
      build_linux:
        description: '构建 Linux'
        required: false
        default: false
        type: boolean
      publish_release:
        description: '发布到 Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release 标签（如 v1.0.0）'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 0 */5 * *'

jobs:
  android:
    if: ${{ github.event.inputs.build_android == 'true' }}
    name: 构建 Android
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
      - run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - run: flutter build apk --release --split-per-abi
      - run: |
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "Kelivo_android_${VERSION}_${abi}.apk"
          done
      - if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: build/app/outputs/flutter-apk/Kelivo_android_*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-arm64-v8a
          path: build/app/outputs/flutter-apk/Kelivo_android_*_arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-armeabi-v7a
          path: build/app/outputs/flutter-apk/Kelivo_android_*_armeabi-v7a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-x86_64
          path: build/app/outputs/flutter-apk/Kelivo_android_*_x86_64.apk

  ios:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.build_ios == 'true' }}
    name: 构建 iOS
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
      - run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: 构建 iOS (自动签名)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          python3 -c "
import re
with open('ios/Runner.xcodeproj/project.pbxproj') as f:
    c = f.read()
c = re.sub(r'(DEVELOPMENT_TEAM\s*=\s*)[^;]+;', r'\1;', c)
with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
    f.write(c)
"
          gem install fastlane --no-document 2>&1 | tail -1
          fastlane spaceauth -u "$APPLE_ID" 2>&1 || true
          flutter build ios --release
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../Kelivo_ios_${VERSION}.ipa Payload
          cd ../../../
      - name: 自动发布 (iOS 每5天续签)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios/latest --cleanup-tag --yes 2>/dev/null || true
          gh release create ios/latest \
            --title "Kelivo iOS (自动续签)" \
            --notes "每 5 天自动构建+签名。手机 Safari 打开此页面 → 下载 IPA → 设置里信任 → 安装" \
            Kelivo_ios_*.ipa
      - name: 发布到 Release（手动触发）
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: Kelivo_ios_*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: Kelivo_ios_*.ipa