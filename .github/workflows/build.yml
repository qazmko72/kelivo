name: Flutter Multi-Platform Build Master

env:
  # 使用 master 分支，不需要指定固定版本
  FLUTTER_CHANNEL: 'master'

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      # 选择构建的平台
      build_ios:
        description: '构建 iOS'
        required: false
        default: true
        type: boolean

      build_android:
        description: '构建 Android'
        required: false
        default: false
        type: boolean

      build_mac:
        description: '构建 macOS'
        required: false
        default: false
        type: boolean

      build_windows:
        description: '构建 Windows'
        required: false
        default: false
        type: boolean

      build_linux:
        description: '构建 Linux'
        required: false
        default: false
        type: boolean

      # 是否发布到 Release（默认不发布）
      publish_release:
        description: '发布到 Release'
        required: false
        default: false
        type: boolean

      # Release 标签（只有选择发布时才需要填写）
      release_tag:
        description: 'Release 标签（如 v1.0.0）'
        required: false
        default: ''
        type: string

  # 定时自动构建 iOS（每 5 天续签一次）
  schedule:
    - cron: '0 0 */5 * *'

jobs:
  # Android 构建
  android:
    if: ${{ github.event.inputs.build_android == 'true' }}
    name: 构建 Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 安装 Flutter (Master)
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 📝 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本号: $VERSION"

      # 如果有签名密钥，写入密钥文件
      - name: 🔑 写入签名密钥
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "✅ 签名配置已写入"

      - name: 🏗️ 构建 APK
        run: flutter build apk --release --split-per-abi

      - name: 📦 重命名 APK
        run: |
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "Kelivo_android_${VERSION}_${abi}.apk"
          done

      - name: 🚀 发布到 Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: build/app/outputs/flutter-apk/Kelivo_android_*.apk

      - name: 📤 上传构建产物 (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: Android-arm64-v8a
          path: build/app/outputs/flutter-apk/Kelivo_android_*_arm64-v8a.apk

      - name: 📤 上传构建产物 (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: Android-armeabi-v7a
          path: build/app/outputs/flutter-apk/Kelivo_android_*_armeabi-v7a.apk

      - name: 📤 上传构建产物 (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: Android-x86_64
          path: build/app/outputs/flutter-apk/Kelivo_android_*_x86_64.apk

  # iOS 构建
  ios:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.build_ios == 'true' }}
    name: 构建 iOS
    runs-on: macos-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 安装 Flutter (Master)
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 📝 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本号: $VERSION"

      - name: 🏗️ 构建 iOS (自动签名)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          # 配置项目
          cd ios
          sed -i '' 's/\(DEVELOPMENT_TEAM =\) [^;]*;/\1 ;/g' Runner.xcodeproj/project.pbxproj
          cd ..

          # 用 fastlane 认证 Apple ID（自动存钥匙链）
          gem install fastlane --no-document 2>&1 | tail -1
          fastlane spaceauth -u "$APPLE_ID" 2>&1 || true

          # 触发自动 provisioning
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates build 2>&1 | tail -10 || true

          # Flutter 正式构建
          flutter build ios --release

          # 打包 IPA
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../Kelivo_ios_${VERSION}.ipa Payload
          cd ../../../

      - name: 📲 自动发布 (iOS 每5天续签)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios/latest --cleanup-tag --yes 2>/dev/null || true
          gh release create ios/latest \
            --title "Kelivo iOS (自动续签)" \
            --notes "每 5 天自动构建+签名。手机 Safari 打开此页面 → 下载 IPA → 设置里信任 → 安装" \
            Kelivo_ios_*.ipa

      - name: 🚀 发布到 Release（手动触发）
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: Kelivo_ios_*.ipa

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: Kelivo_ios_*.ipa