name: Get FASTLANE_SESSION

on:
  workflow_dispatch:
    inputs:
      sms_code:
        description: '2FA code from phone SMS'
        required: false

jobs:
  auth:
    runs-on: macos-latest
    steps:
      - run: gem install fastlane --no-document

      - name: Run spaceauth
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          unset FASTLANE_SESSION 2>/dev/null || true
          export FASTLANE_PASSWORD="$APPLE_ID_PASSWORD"
          export FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD="$APP_SPECIFIC_PASSWORD"
          brew install expect 2>/dev/null || true

          if [ -n "${{ inputs.sms_code }}" ]; then
            # 2FA code provided — complete auth
            expect -c "
              set timeout 60
              spawn fastlane spaceauth -u ${{ secrets.APPLE_ID }}
              expect -re {[Cc]ode|[Ss]MS|[Tt]wo.?[Ff]actor}
              send \"${{ inputs.sms_code }}\r\"
              expect eof
            " 2>&1 | tee /tmp/out.txt
          else
            # First run — try without 2FA (app-specific password may bypass it)
            expect -c "
              set timeout 30
              spawn fastlane spaceauth -u ${{ secrets.APPLE_ID }}
              expect {
                -re {[Cc]ode|[Ss]MS|[Tt]wo.?[Ff]actor} {
                  puts \"===== 2FA REQUIRED =====\"
                  send \"000000\r\"
                  expect eof
                }
                timeout {
                  puts \"===== TIMEOUT - NO 2FA PROMPT =====\"
                }
              }
            " 2>&1 | tee /tmp/out.txt
          fi

          # Extract session
          SESSION=$(grep -o "----.*----" /tmp/out.txt 2>/dev/null || true)
          if [ -n "$SESSION" ]; then
            echo "✅ SESSION FOUND!"
            echo "FASTLANE_SESSION=$SESSION"
          elif [ -n "${{ inputs.sms_code }}" ]; then
            echo "❌ Still failed with code"
            grep -i "error\|wrong\|invalid\|could not" /tmp/out.txt || true
            exit 1
          else
            echo "📱 看手机有没有收到验证码"
            echo "收到来这填 → github.com/qazmko72/kelivo/actions/workflows/session.yml"
            grep "2FA REQUIRED\|credentials" /tmp/out.txt || true
            exit 1
          fi
