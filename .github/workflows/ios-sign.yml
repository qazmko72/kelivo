name: iOS Re-sign & Release

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  resign:
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - name: 下载上次 Release IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ios/latest --pattern "*.ipa" -D . 2>/dev/null || true
          IPA=$(ls *.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "❌ 无基础 IPA。先在 Release 上传一个初始 IPA。"
            exit 1
          fi
          echo "FOUND_IPA=$IPA" >> $GITHUB_ENV

      - name: 安装 fastlane
        run: gem install fastlane --no-document

      - name: 生成证书 + 描述文件
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          DEVICE_UDID: ${{ secrets.DEVICE_UDID }}
        run: |
          export FASTLANE_USER="$APPLE_ID"
          export FASTLANE_PASSWORD="$APPLE_ID_PASSWORD"
          export FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD="$APPLE_ID_PASSWORD"
          export FASTLANE_DONT_STORE_PASSWORD=1

          cd ios

          fastlane run register_device \
            name:"iPhone" udid:"$DEVICE_UDID" \
            username:"$APPLE_ID" 2>&1 || echo "设备注册跳过"

          fastlane run cert \
            development:true \
            username:"$APPLE_ID" \
            output_path:"$RUNNER_TEMP/certs" 2>&1 || echo "证书生成跳过"

          fastlane run sigh \
            development:true \
            username:"$APPLE_ID" \
            udid:"$DEVICE_UDID" \
            output_path:"$RUNNER_TEMP/profiles" 2>&1 || echo "描述文件生成跳过"

          echo "=== 证书 ===" && ls "$RUNNER_TEMP/certs/" 2>/dev/null || echo "无"
          echo "=== 描述文件 ===" && ls "$RUNNER_TEMP/profiles/" 2>/dev/null || echo "无"

      - name: 重签名 IPA
        run: |
          export FASTLANE_USER="${{ secrets.APPLE_ID }}"
          export FASTLANE_PASSWORD="${{ secrets.APPLE_ID_PASSWORD }}"
          export FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD="${{ secrets.APPLE_ID_PASSWORD }}"

          IPA="${{ env.FOUND_IPA }}"
          PROFILE=$(ls "$RUNNER_TEMP/profiles/"*.mobileprovision 2>/dev/null | head -1)

          if [ -n "$PROFILE" ]; then
            fastlane run resign ipa:"$IPA" provisioning_profile:"$PROFILE" 2>&1
          else
            fastlane run resign ipa:"$IPA" signing_style:automatic 2>&1
          fi

          if [ -f resigned.ipa ]; then
            mv resigned.ipa Kelivo_signed.ipa
          else
            cp "$IPA" Kelivo_signed.ipa
          fi

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios/latest --cleanup-tag --yes 2>/dev/null || true
          gh release create ios/latest \
            --title "Kelivo iOS $(date -u '+%Y-%m-%d')" \
            --notes "每 5 天自动签名。\n手机 Safari 下载 → AltStore 安装。\nUDID: ${{ secrets.DEVICE_UDID }}" \
            Kelivo_signed.ipa
