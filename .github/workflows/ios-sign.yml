name: iOS Build & Sign

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */5 * *'

jobs:
  ios:
    name: 构建 iOS
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: 降级 image_cropper + 构建
        run: |
          python3 -c "import re;p='pubspec.yaml';c=open(p).read();c=re.sub(r'image_cropper:.*','image_cropper: ^11.0.0',c);open(p,'w').write(c)"
          flutter pub get
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../Kelivo_ios_${VERSION}.ipa Payload
          cd ../../../
      - name: 发布 Release（定时任务用）
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios/latest --cleanup-tag --yes 2>/dev/null || true
          gh release create ios/latest \
            --title "Kelivo iOS (自动构建)" \
            --notes "每 5 天自动构建。手机下载后用 AltStore 侧载安装。" \
            Kelivo_ios_*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: Kelivo_ios_*.ipa
