name: iOS Build & Sign

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */5 * *'

jobs:
  ios:
    name: 构建 iOS
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: 构建 IPA
        run: |
          python3 -c "import re;p='pubspec.yaml';c=open(p).read();c=re.sub(r'image_cropper:.*','image_cropper: ^11.0.0',c);open(p,'w').write(c)"
          flutter pub get
          python3 -c "import re;p='ios/Runner.xcodeproj/project.pbxproj';c=open(p).read();c=re.sub(r\"(DEVELOPMENT_TEAM\s*=\s*)[^;]+;\",r'\1;',c);open(p,'w').write(c)"
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../Kelivo_ios_${VERSION}.ipa Payload
          cd ../../../
          ls -la Kelivo_ios_*.ipa
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: Kelivo_ios_*.ipa
