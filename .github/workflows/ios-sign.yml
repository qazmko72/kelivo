name: iOS Build & Sign

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */5 * *'

jobs:
  ios:
    name: 构建 iOS 并签名
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true
      - run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: 构建 iOS
        env:
          FLUTTER_XCODE_BUILD_SETTINGS: "-skipPackageUpdates"
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../Kelivo_ios_${VERSION}.ipa Payload
      - name: 发布 Release（每 5 天自动续签）
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios/latest --cleanup-tag --yes 2>/dev/null || true
          gh release create ios/latest \
            --title "Kelivo iOS (自动续签)" \
            --notes "每 5 天自动构建+签名。手机 Safari 打开此页面 → 下载 IPA → 设置里信任 → 安装" \
            Kelivo_ios_*.ipa
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: Kelivo_ios_*.ipa
