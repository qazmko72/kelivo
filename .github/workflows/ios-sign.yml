name: iOS Build & Sign

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */5 * *'

jobs:
  ios:
    name: 构建 iOS
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: 降级 image_cropper
        run: |
          python3 -c "
          import re
          p = 'pubspec.yaml'
          c = open(p).read()
          c = re.sub(r'image_cropper:.*', 'image_cropper: ^11.0.0', c)
          open(p, 'w').write(c)
          "
      - name: 构建 + 签名 IPA
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          set +e
          flutter pub get
          python3 scripts/clear_development_team.py ios/Runner.xcodeproj/project.pbxproj
          gem install fastlane --no-document 2>&1 | tail -1
          fastlane spaceauth -u "$APPLE_ID" 2>&1
          SPACEAUTH_EXIT=$?
          if [ $SPACEAUTH_EXIT -eq 0 ]; then
            echo "fastlane auth OK, building signed IPA"
            flutter build ios --release
          else
            echo "fastlane auth failed ($SPACEAUTH_EXIT), building unsigned"
            flutter build ios --release --no-codesign
          fi
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../Kelivo_ios_${VERSION}.ipa Payload
          cd ../../../
          ls -la Kelivo_ios_*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: Kelivo_ios_*.ipa
